name: strictbudget

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strictbudget
      POSTGRES_PASSWORD: strictbudget
      POSTGRES_DB: strictbudget
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strictbudget -d strictbudget"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
