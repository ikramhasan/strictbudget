# pnpm 12 enforces a default minimumReleaseAge (24h) supply-chain policy: a brand-new
# release only resolves once it has been on the registry for a day. Catalog entries here
# must resolve to a version already past that cutoff, or `pnpm install` will fail (or, on
# a non-frozen install, auto-append a minimumReleaseAgeExclude block instead — don't rely
# on that; pin an older version instead so the security policy stays intact). turbo is
# pinned to ^2.11.4 rather than ^2.11.5 for this reason (2.11.5 was too new at pin time).
# Likewise @tanstack/react-router, router-cli, and router-plugin are pinned to exact
# versions 1.170.38 / 1.167.38 / 1.168.40 (not the newer 1.170.40 / 1.167.39 / 1.168.41)
# — those releases were too new at pin time. Exact pins (no ^) so pnpm doesn't silently
# re-resolve to the newer, non-compliant patch that a caret range would also satisfy;
# this also keeps their transitive router-core / router-generator versions within the
# policy, so no exclusion list is needed.
