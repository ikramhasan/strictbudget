# Self-hosted strictbudget: PostgreSQL and the app in one stack. See "Self-hosting" in README.md.
#   echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
#   docker compose -f docker-compose.prod.yml up -d --build
# Then open STRICTBUDGET_URL (default http://localhost:3000). Settings are read from .env.
name: strictbudget-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strictbudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strictbudget}
      POSTGRES_DB: strictbudget
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strictbudget -d strictbudget"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: strictbudget
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Applies any new migrations, then starts the server.
    command: ["sh", "-c", "node dist/migrate.mjs && exec node dist/index.mjs"]
    ports:
      - "${STRICTBUDGET_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://strictbudget:${POSTGRES_PASSWORD:-strictbudget}@db:5432/strictbudget
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      # The URL people open strictbudget at; the API and the web app share it.
      BETTER_AUTH_URL: ${STRICTBUDGET_URL:-http://localhost:3000}
      WEB_ORIGIN: ${STRICTBUDGET_URL:-http://localhost:3000}
      # Behind a reverse proxy: its CIDRs, or the header it sets to the client IP (rate limits).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Transaction attachments, kept in the data volume.
      STORAGE_DIR: /data
      # Optional: email through Resend, and the in-app AI assistant.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - data:/data

volumes:
  db:
  data:
