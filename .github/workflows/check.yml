name: Check
# Main only, not PRs: both jobs take minutes, and Railway deploys a main commit only once this
# workflow passes on it, so a failure never reaches production and is fixed from the main run.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strictbudget
          POSTGRES_PASSWORD: strictbudget
          POSTGRES_DB: strictbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strictbudget -d strictbudget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same databases as docker compose (docker/postgres/init), and .env.example's settings,
      # which point at them. Tests read the root .env: turbo's strict env mode drops job env vars.
      - name: Prepare database and .env
        run: |
          PGPASSWORD=strictbudget psql -h localhost -U strictbudget -d strictbudget -c "CREATE DATABASE strictbudget_test OWNER strictbudget"
          cp .env.example .env
      - run: pnpm check
        env:
          # 4 vCPUs (public repo), but API tests mostly wait on Postgres: one worker more than cores
          # keeps them all busy.
          API_TEST_WORKERS: 5

  # The production image (Dockerfile) builds, and its migrate step and server start on a
  # fresh database.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strictbudget
          POSTGRES_PASSWORD: strictbudget
          POSTGRES_DB: strictbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strictbudget -d strictbudget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t strictbudget:ci .
      - name: Migrate and start
        run: |
          DB=postgres://strictbudget:strictbudget@127.0.0.1:5432/strictbudget
          docker run --rm --network host -e DATABASE_URL=$DB strictbudget:ci node dist/migrate.mjs
          docker run -d --name app --network host -e DATABASE_URL=$DB \
            -e BETTER_AUTH_SECRET=ci-image-check-secret-that-is-long-enough \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000 -e WEB_ORIGIN=http://127.0.0.1:3000 \
            -e RESEND_API_KEY=re_ci_not_a_key -e FROM_EMAIL=example.com strictbudget:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:3000/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/v1/health
          curl -sf http://127.0.0.1:3000/ | grep -q 'id="root"'
          curl -sf http://127.0.0.1:3000/budgets | grep -q 'id="root"'
      # The marketing site's image (apps/site/Dockerfile) builds and serves its pages.
      - run: docker build -f apps/site/Dockerfile -t strictbudget-site:ci .
      - name: Serve the site
        run: |
          docker run -d --name site -p 8080:8080 strictbudget-site:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = 404
          curl -sI -H 'Host: www.strictbudget.app' http://127.0.0.1:8080/ | grep -qi '^location: https://strictbudget.app/'
      - if: failure()
        run: |
          docker logs app || true
          docker logs site || true
